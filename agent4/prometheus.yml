global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'router-performance-monitoring'

scrape_configs:
  - job_name: 'performance-optimization-agent'
    static_configs:
      - targets: ['performance-optimization-agent:9091']
        labels:
          service: 'router-optimization'
          environment: 'production'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Add your existing monitoring targets here
  # - job_name: 'other-metrics'
  #   static_configs:
  #     - targets: ['localhost:9100']
