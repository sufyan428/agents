version: '3.8'

services:
  # Security & Intrusion Detection Agent
  security-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: security-id-agent
    restart: unless-stopped
    ports:
      - '9091:9091' # Prometheus metrics
      - '514:514/udp' # Syslog
      - '162:162/udp' # SNMP traps
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - TZ=UTC
    networks:
      - security-net
    depends_on:
      - prometheus
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - security-net

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    networks:
      - security-net
    depends_on:
      - prometheus

  # Logspout for log aggregation (optional)
  logspout:
    image: gliderlabs/logspout:latest
    container_name: logspout
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - SYSLOG_FORMAT=rfc3164
    command: syslog://security-agent:514
    networks:
      - security-net
    depends_on:
      - security-agent

volumes:
  prometheus-data:
  grafana-data:

networks:
  security-net:
    driver: bridge
