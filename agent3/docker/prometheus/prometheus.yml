global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'security-monitoring'
    replica: '1'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files:
  - '/etc/prometheus/alerts.yml'

# Scrape configurations
scrape_configs:
  # Security Agent Metrics
  - job_name: 'security-agent'
    static_configs:
      - targets: ['security-agent:9091']
        labels:
          service: 'security-id-agent'
          environment: 'production'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
