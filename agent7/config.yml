# AI Correlation & Reasoning Agent - non-secret settings.
# The API key itself is BYOK - it lives in .env, never here.

server:
  port: 9096
  health_path: /health
  metrics_path: /metrics

orchestrator:
  base_url: "http://localhost:8080"
  timeout_ms: 5000

ai:
  # "auto" picks the provider based on which key is present in .env:
  # OPENROUTER_API_KEY -> openrouter, else ANTHROPIC_API_KEY -> anthropic.
  # Force one explicitly with "anthropic" or "openrouter" if you set both.
  provider: "auto"
  anthropic:
    model: "claude-opus-4-8"
    effort: "medium"          # low | medium | high | xhigh | max
  openrouter:
    # A mid-size free model, chosen for RELIABILITY over raw size. Measured
    # 3/3 valid structured responses at ~1.2s each, parsing cleanly with no
    # fence-stripping or repair pass needed. OpenRouter's largest free models
    # are the most oversubscribed and return empty completions under load,
    # which is bad for an unattended agent polling every 60-120s.
    #
    # This is only a default. Point it at any model you like - set
    # OPENROUTER_MODEL (or AI_MODEL) to override without touching this file.
    # Agents 7-10 scale with the model behind them: a free model works, a
    # frontier model works better. That is your call and your bill.
    model: "nvidia/nemotron-3-nano-30b-a3b:free"
  max_tokens: 4096
  request_timeout_ms: 45000

correlation:
  poll_interval_seconds: 60
  history_size: 30
  # Only spend an LLM call when something actually looks off (an agent is
  # unhealthy/stopped, or its status flipped since the last poll). A full
  # baseline check still runs every `baseline_every_n_polls` cycles regardless,
  # so slow-building issues don't go unseen just because nothing looked wrong
  # at any single poll.
  anomaly_only: true
  baseline_every_n_polls: 30

agents:
  - name: agent1-monitoring
    port: 9090
  - name: agent2-resilience
    port: 9091
  - name: agent3-security
    port: 9092
  - name: agent4-performance
    port: 9093
  - name: agent5-automation
    port: 9094

logging:
  level: "info"
  directory: "./logs"
