name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first: a queue of CI runs on
# superseded commits tells nobody anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Control endpoints fail closed without this, so the route tests need one.
  # A literal in CI is correct: it is not a secret, it is a fixture.
  AGENT_API_TOKEN: ci-test-token

jobs:
  # One install for the whole workspace. The ten agents and four packages share
  # a single lockfile, so per-agent installs would be both slower and wrong.
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check

  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is current LTS and what the images use. 20 is the floor the
        # engines field claims to support, and claiming it without testing it
        # is how a project ends up broken for half its users.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - name: Build the TypeScript packages
        run: npm run build
      - name: Package tests
        run: npm run test:packages
      - name: Agent tests
        run: npm run test:agents

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Fail on a high-severity advisory in anything we ship
        # --omit=dev deliberately: a advisory in eslint does not reach a user.
        run: npm audit --omit=dev --audit-level=high
      - name: Report dev advisories without failing
        run: npm audit --audit-level=high || true

  end-to-end:
    name: End-to-end against the simulator
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      - name: Start the router simulator
        run: |
          npm run sim > /tmp/sim.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8090/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8090/health || { cat /tmp/sim.log; exit 1; }

      - name: Boot the framework and verify every core agent comes up
        run: bash scripts/smoke-test.sh

      - name: Fault injection reaches an agent and becomes a correlated incident
        run: |
          cd agent6 && AGENT_API_TOKEN=ci-test-token node src/index.js > /tmp/orchestrator.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8080/health >/dev/null && break
            sleep 2
          done
          sleep 25
          node tests/e2e-correlation.js

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: |
            /tmp/sim.log
            /tmp/orchestrator.log
          if-no-files-found: ignore
