# Dependabot keeps 10 independent Node projects and the CI actions current.
# Grouped so a routine bump is one PR per agent, not five.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/agent1"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      agent1-minor-and-patch:
        update-types: ["minor", "patch"]
