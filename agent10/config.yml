# AI ChatOps Agent - non-secret settings.
# The AI provider key is BYOK - paste it once into agent6/.env (shared across
# all AI agents) or, for standalone runs, into this agent's own .env.
# Slack/Discord webhook URLs (optional, separate from the AI key) also go in
# .env - see .env.example. Neither is required: without them, this agent still
# works fully over its own /api/chat endpoint, and proactive findings are just
# recorded locally (GET /api/notifications) instead of pushed anywhere.

server:
  port: 9099
  health_path: /health
  metrics_path: /metrics

orchestrator:
  base_url: "http://localhost:8080"
  timeout_ms: 10000

sources:
  agent7_url: "http://localhost:9096"
  agent8_url: "http://localhost:9097"
  agent9_url: "http://localhost:9098"
  timeout_ms: 10000

# Every agent name the chat interface is allowed to reference/act on.
known_agents:
  - agent1-monitoring
  - agent2-resilience
  - agent3-security
  - agent4-performance
  - agent5-automation
  - agent7-correlation
  - agent8-reporting
  - agent9-remediation
  - agent10-chatops

ai:
  # Provider-agnostic. "openai-compatible" reaches OpenRouter, Gemini's
  # compatibility endpoint, Together, Groq, Ollama, vLLM, LM Studio and
  # anything else speaking /chat/completions. Use "anthropic" for the native
  # Anthropic API.
  provider: "openai-compatible"
  base_url: "https://openrouter.ai/api/v1"

  # Any model name the endpoint accepts. The framework holds no opinion and
  # maintains no allowlist - one would be wrong within a month.
  #
  # The default is free and was chosen by measurement rather than preference:
  # 3/3 valid structured responses at ~1.2s, parsing cleanly with no repair
  # pass. Larger free models are more oversubscribed and return empty
  # completions under load, which is bad for an agent polling unattended.
  #
  # Agents 7-10 scale with whatever is behind them. A free model works; a
  # frontier model works better. That is your call and your bill.
  model: "nvidia/nemotron-3-nano-30b-a3b:free"

  max_tokens: 4096
  request_timeout_ms: 45000

  # Spend controls, enforced locally over a rolling 24h window. Set the call
  # budget to 0 to disable this agent's model use entirely without touching
  # any other configuration.
  daily_call_budget: 500
  daily_token_budget: 0
notifications:
  poll_interval_seconds: 120
  history_size: 30

logging:
  level: "info"
  directory: "./logs"
