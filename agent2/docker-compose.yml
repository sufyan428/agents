version: '3.8'

services:
  resilience-failover-agent:
    build: .
    container_name: resilience-failover-agent
    restart: unless-stopped
    ports:
      - "9092:9090"   # External 9092 (Agent 1 uses 9090)
      - "1514:514/udp" # Syslog port
      - "4000:3000"   # External 4000 (Agent 1 uses 3000)
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - METRICS_PORT=9090
    networks:
      - monitoring_resilience
    cap_add:
      - NET_ADMIN
    privileged: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-resilience
    restart: unless-stopped
    ports:
      - "9093:9090"   # External 9093 (Agent 1 uses 9091)
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
    networks:
      - monitoring_resilience

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-resilience
    restart: unless-stopped
    ports:
      - "3002:3000"   # External 3002 (Agent 1 uses 3001)
    volumes:
      - ./monitoring/grafana-data:/var/lib/grafana
      - ./monitoring/grafana-provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - monitoring_resilience
    depends_on:
      - prometheus

networks:
  monitoring_resilience:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
